name: smart-learning-system

# The API and the worker run the same image; naming it lets Compose build it once.
x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://smart_learning:change-me-before-deployment@postgres:5432/smart_learning}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-gpt-oss:20b}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}

x-backend-common: &backend-common
  build:
    context: ./backend
  image: ${COMPOSE_PROJECT_NAME}-backend
  env_file:
    - path: ./.env
      required: false
  environment: *backend-env
  depends_on:
    postgres:
      condition: service_healthy
    qdrant:
      condition: service_healthy
  volumes:
    - private_uploads:/data/uploads
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_learning}
      POSTGRES_USER: ${POSTGRES_USER:-smart_learning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    <<: *backend-common
    environment:
      <<: *backend-env
      APP_ORIGIN: ${APP_ORIGIN:-https://smart-learning.test}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://smart-learning.test}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *backend-common
    command: ["python", "-m", "app.worker"]

  web:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  private_uploads:
