server {
    listen 80;
    server_name _;
    client_max_body_size 22m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Docker may assign backend a new IP when the container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Chat streams turn buffering off per response with X-Accel-Buffering.
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    # Vite puts a content hash in every asset name, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # Revalidate index.html so a new build's asset names are picked up.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
